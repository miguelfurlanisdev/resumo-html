    <style>
        html,
        body{
            height: 100%;
            margin: 0;

        body{
            /* background-color: red; */
            background-image: linear-gradient(90deg, red 30%, blue, green, yellow, white, purple, orange 60%);
            background-size: auto, 100% 100%;
            
        }
        #gradiente{
            background-color: orange;
            width: 200px;
            height: 200px;
            margin: 50px auto;

            box-shadow: 30px 30px 10px 20px blue,
            -30px -30px 30px 30px red,
            -30px 30px 15px 40px yellow,
            30px -30px 30px 50px green;
              
            /*  Primeiro valor - Quanto ele se deslocará no eixo x
                Segundo valor - Quanto ele se deslocará no eixo y
                Terceiro valor - O quanto estará desfocado
                (quarto valor) - Tamanho da sombra relativo ao objeto
                Quarto valor - A cor da sombra */
        }
        h1{
            font-family: sans-serif;
            font-size: 50px;
            text-align: center;

            text-shadow: -1px 1px 0 rgb(154, 154, 154),
            -2px 2px 0 rgb(169, 168, 168),
            -3px 3px 0 rgb(175, 175, 175),
            -4px 4px 0 rgb(209, 209, 209),
            -5px 5px 0 rgb(189, 189, 189);

            color: white;
        }
